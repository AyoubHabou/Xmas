<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Equipment Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black:   #0d0d0d;
    --yellow:  #FFD000;
    --yellow2: #FFA500;
    --white:   #F5F0E8;
    --grey:    #1a1a1a;
    --grey2:   #2a2a2a;
    --grey3:   #3a3a3a;
    --red:     #E63232;
    --green:   #2ECC71;
    --text:    #c8c0b0;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* diagonal stripe background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 40px,
      rgba(255,208,0,0.018) 40px,
      rgba(255,208,0,0.018) 42px
    );
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 40px; }

  /* ── HEADER ── */
  .header {
    background: var(--yellow);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon {
    width: 42px; height: 42px;
    background: var(--black);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-icon svg { width: 24px; height: 24px; }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--black);
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .header-sub {
    font-size: 11px;
    font-weight: 600;
    color: rgba(0,0,0,0.55);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ── SECTIONS ── */
  .section { padding: 20px 16px 0; }

  .step-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--grey3);
  }
  .step-num {
    width: 20px; height: 20px;
    background: var(--yellow);
    color: var(--black);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* ── DRIVER GRID ── */
  .driver-search-wrap { position: relative; margin-bottom: 10px; }
  .driver-search {
    width: 100%;
    background: var(--grey2);
    border: 2px solid var(--grey3);
    border-radius: 10px;
    padding: 12px 14px 12px 40px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .driver-search:focus { border-color: var(--yellow); }
  .driver-search::placeholder { color: #555; }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #555; width: 18px; height: 18px;
    pointer-events: none;
  }

  .driver-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .driver-grid::-webkit-scrollbar { width: 4px; }
  .driver-grid::-webkit-scrollbar-track { background: transparent; }
  .driver-grid::-webkit-scrollbar-thumb { background: var(--grey3); border-radius: 2px; }

  .driver-btn {
    background: var(--grey2);
    border: 2px solid var(--grey3);
    border-radius: 10px;
    padding: 11px 10px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.2;
    word-break: break-word;
  }
  .driver-btn:active { transform: scale(0.97); }
  .driver-btn.selected {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--black);
    font-weight: 700;
  }

  /* ── ITEMS ── */
  .items-list { display: flex; flex-direction: column; gap: 8px; }

  .item-row {
    background: var(--grey2);
    border: 2px solid var(--grey3);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
  }
  .item-row.has-qty { border-color: var(--yellow); }

  .item-icon {
    width: 38px; height: 38px;
    background: var(--grey3);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
  }
  .item-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.2;
  }
  .item-stock {
    font-size: 11px;
    color: #555;
    font-weight: 400;
    margin-top: 2px;
  }
  .qty-ctrl {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--grey3);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 36px; height: 36px;
    background: none;
    border: none;
    color: var(--white);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    line-height: 1;
  }
  .qty-btn:active { background: var(--yellow); color: var(--black); }
  .qty-val {
    min-width: 28px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--yellow);
  }

  /* ── DATE ── */
  .date-input {
    width: 100%;
    background: var(--grey2);
    border: 2px solid var(--grey3);
    border-radius: 10px;
    padding: 14px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s;
  }
  .date-input:focus { border-color: var(--yellow); }
  .date-input::-webkit-calendar-picker-indicator { filter: invert(0.6); }

  /* ── REASON ── */
  .reason-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .reason-btn {
    background: var(--grey2);
    border: 2px solid var(--grey3);
    border-radius: 10px;
    padding: 12px 10px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reason-btn:active { transform: scale(0.97); }
  .reason-btn.selected {
    background: var(--grey);
    border-color: var(--yellow);
    color: var(--yellow);
  }

  /* ── SUBMIT ── */
  .submit-wrap { padding: 24px 16px 0; }
  .submit-btn {
    width: 100%;
    background: var(--yellow);
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--black);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled {
    background: var(--grey3);
    color: #555;
    cursor: not-allowed;
  }
  .submit-btn.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.15);
  }

  .validation-msg {
    background: rgba(230,50,50,0.12);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 13px;
    color: #ff8080;
    display: none;
  }
  .validation-msg.show { display: block; }

  /* ── SUCCESS SCREEN ── */
  .success-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--black);
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .success-screen.show { display: flex; }

  .success-icon {
    width: 80px; height: 80px;
    background: var(--green);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .success-sub {
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 32px;
    max-width: 280px;
  }
  .success-items {
    background: var(--grey2);
    border-radius: 12px;
    padding: 16px 20px;
    width: 100%;
    max-width: 340px;
    text-align: left;
    margin-bottom: 32px;
  }
  .success-item-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--grey3);
    font-size: 14px;
  }
  .success-item-row:last-child { border-bottom: none; }
  .success-item-name { color: var(--white); }
  .success-item-qty {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--yellow);
  }
  .new-request-btn {
    background: none;
    border: 2px solid var(--grey3);
    border-radius: 10px;
    padding: 14px 32px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .new-request-btn:active { border-color: var(--yellow); color: var(--yellow); }

  /* ── CONFIG BANNER ── */
  .config-banner {
    background: rgba(255,165,0,0.12);
    border: 1px solid rgba(255,165,0,0.4);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 16px 16px 0;
    font-size: 12px;
    color: #ffb347;
    line-height: 1.5;
  }
  .config-banner strong { color: var(--yellow2); display: block; margin-bottom: 3px; }

  .divider { height: 1px; background: var(--grey2); margin: 20px 16px 0; }
</style>
</head>
<body>


<div class="app">
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFD000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Equipment Request</div>
      <div class="header-sub">Fill out all steps to submit</div>
    </div>
  </div>

  <!-- STEP 1: DRIVER -->
  <div class="section">
    <div class="step-label"><span class="step-num">1</span> Your Name</div>
    <div class="driver-search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" class="driver-search" id="driverSearch" placeholder="Search your name..." oninput="filterDrivers(this.value)" autocomplete="off">
    </div>
    <div class="driver-grid" id="driverGrid"></div>
  </div>

  <div class="divider"></div>

  <!-- STEP 2: ITEMS -->
  <div class="section">
    <div class="step-label"><span class="step-num">2</span> Items Needed</div>
    <div class="items-list" id="itemsList"></div>
  </div>

  <div class="divider"></div>

  <!-- STEP 3: DATE -->
  <div class="section">
    <div class="step-label"><span class="step-num">3</span> Date Needed By</div>
    <input type="date" class="date-input" id="dateInput">
  </div>

  <div class="divider"></div>

  <!-- STEP 4: REASON -->
  <div class="section">
    <div class="step-label"><span class="step-num">4</span> Reason</div>
    <div class="reason-grid" id="reasonGrid"></div>
  </div>

  <!-- SUBMIT -->
  <div class="submit-wrap">
    <button class="submit-btn" id="submitBtn" onclick="submitRequest()">
      Submit Request
    </button>
    <div class="validation-msg" id="validationMsg"></div>
  </div>
</div>

<!-- SUCCESS SCREEN -->
<div class="success-screen" id="successScreen">
  <div class="success-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="success-title">Request Sent!</div>
  <div class="success-sub" id="successSub">Your request has been logged and your supervisor will be notified.</div>
  <div class="success-items" id="successItems"></div>
  <button class="new-request-btn" onclick="resetForm()">Submit Another Request</button>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// REPLACE THIS with your Google Apps Script Web App URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3E72EZpz55krg8eKehiTYicD8sf_VYNbCU6xgDHKqeRzfWQgC2DkmuqULtLCQ-A0N/exec";

const DRIVERS = [
  "Abdalrazek Abdalrazek","Ahmad Kammouni","Allen Brown","Andre Larche",
  "Andrii Riabeka","Anthony Zanni","Arthur Lacroix","Arthur Nguyen",
  "Ayoub Habou","Bader Saif","Christophe Tremblay","Daniel Jima",
  "Dauphin Sinzinkayo","Don Bigras","Duane Locke","FAWAZ Matar",
  "Fawaz Kazem","George Chalhoub","Habtamu Tadesse","Jacques Parent",
  "James Burchill","James Masse","Jarren Miehm","Jean-Francois b Hebert",
  "Khalid Wahid","Leon Richard Kabinda","Loranc Alkhouri",
  "Louis-philippe Gravel","Mark Manery","Matt McCormick",
  "Michael Bellefeuille","Mohamed Abougafar","Musa Al-sohail",
  "Neil Fellner","Nidal Zouwayni","Nidal Farara","Omojero Imonia",
  "Parfait Ngabonziza","Randy Armitage","Robert Given","Rock Auger",
  "Rohan James","Sahnd Almufti","Sean VanWallegham","Stephane Dore",
  "Tarek Abou Karnib","WILLY SENOGA"
];

const ITEMS = [
  { name: "Safety Glasses",       icon: "🥽" },
  { name: "Blue Summer Gloves",   icon: "🧤" },
  { name: "Orange Summer Gloves", icon: "🧤" },
  { name: "Blue Winter Gloves",   icon: "🧤" },
  { name: "Safety Hard Hat",      icon: "⛑️" },
  { name: "Ice Cleat",            icon: "🦶" },
  { name: "Face Shield",          icon: "🛡️" },
  { name: "Brackets",             icon: "🔩" },
  { name: "Coveralls",            icon: "🦺" },
  { name: "Hearing Protection",   icon: "🎧" },
];

const REASONS = ["Worn Out","Damaged/Broken","Lost Item","New Driver","Replacement","Other"];

// ── STATE ─────────────────────────────────────────────────────────────────────
let selectedDriver = null;
let quantities = {};
let selectedReason = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').value = today;
  document.getElementById('dateInput').min = today;

  renderDrivers(DRIVERS);
  renderItems();
  renderReasons();
}

// ── DRIVERS ───────────────────────────────────────────────────────────────────
function renderDrivers(list) {
  const grid = document.getElementById('driverGrid');
  grid.innerHTML = list.map(d => `
    <button class="driver-btn ${d === selectedDriver ? 'selected' : ''}"
            onclick="selectDriver('${d.replace(/'/g, "\\'")}')">
      ${d}
    </button>`).join('');
}

function filterDrivers(query) {
  const filtered = query
    ? DRIVERS.filter(d => d.toLowerCase().includes(query.toLowerCase()))
    : DRIVERS;
  renderDrivers(filtered);
}

function selectDriver(name) {
  selectedDriver = name;
  document.getElementById('driverSearch').value = name;
  renderDrivers([name]);
  // Small scroll to next section
  setTimeout(() => {
    document.getElementById('itemsList').scrollIntoView({behavior:'smooth', block:'start'});
  }, 150);
}

// ── ITEMS ─────────────────────────────────────────────────────────────────────
function renderItems() {
  const list = document.getElementById('itemsList');
  list.innerHTML = ITEMS.map((item, i) => `
    <div class="item-row ${(quantities[item.name]||0) > 0 ? 'has-qty' : ''}" id="itemrow-${i}">
      <div class="item-icon">${item.icon}</div>
      <div style="flex:1">
        <div class="item-name">${item.name}</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${item.name.replace(/'/g,"\\'")}', ${i}, -1)">−</button>
        <div class="qty-val" id="qty-${i}">${quantities[item.name] || 0}</div>
        <button class="qty-btn" onclick="changeQty('${item.name.replace(/'/g,"\\'")}', ${i}, 1)">+</button>
      </div>
    </div>`).join('');
}

function changeQty(itemName, idx, delta) {
  const current = quantities[itemName] || 0;
  const newVal = Math.max(0, Math.min(20, current + delta));
  quantities[itemName] = newVal;
  document.getElementById(`qty-${idx}`).textContent = newVal;
  const row = document.getElementById(`itemrow-${idx}`);
  row.classList.toggle('has-qty', newVal > 0);
}

// ── REASONS ───────────────────────────────────────────────────────────────────
function renderReasons() {
  document.getElementById('reasonGrid').innerHTML = REASONS.map(r => `
    <button class="reason-btn ${r === selectedReason ? 'selected' : ''}"
            onclick="selectReason('${r}')">
      ${r}
    </button>`).join('');
}

function selectReason(r) {
  selectedReason = r;
  renderReasons();
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
function validate() {
  if (!selectedDriver) return "Please select your name.";
  const items = Object.entries(quantities).filter(([,q]) => q > 0);
  if (items.length === 0) return "Please select at least one item and quantity.";
  if (!selectedReason) return "Please select a reason.";
  return null;
}

async function submitRequest() {
  const err = validate();
  const msg = document.getElementById('validationMsg');
  if (err) {
    msg.textContent = err;
    msg.classList.add('show');
    return;
  }
  msg.classList.remove('show');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = "Submitting...";
  btn.classList.add('loading');

  const items = Object.entries(quantities).filter(([,q]) => q > 0);
  const dateVal = document.getElementById('dateInput').value;
  const now = new Date().toISOString().split('T')[0];

  const payload = {
    driver: selectedDriver,
    dateTaken: now,
    dateNeededBy: dateVal,
    reason: selectedReason,
    items: items.map(([name, qty]) => ({ name, qty }))
  };

  // If no script URL set, show demo success
  if (SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL") {
    await new Promise(r => setTimeout(r, 1000));
    showSuccess(payload);
    btn.disabled = false;
    btn.textContent = "Submit Request";
    btn.classList.remove('loading');
    return;
  }

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    showSuccess(payload);
  } catch(e) {
    msg.textContent = "Network error. Please check your connection and try again.";
    msg.classList.add('show');
  }

  btn.disabled = false;
  btn.textContent = "Submit Request";
  btn.classList.remove('loading');
}

function showSuccess(payload) {
  const screen = document.getElementById('successScreen');
  const itemsDiv = document.getElementById('successItems');
  const sub = document.getElementById('successSub');

  sub.textContent = `Request logged for ${payload.driver} — needed by ${payload.dateNeededBy}.`;

  itemsDiv.innerHTML = payload.items.map(i => `
    <div class="success-item-row">
      <span class="success-item-name">${i.name}</span>
      <span class="success-item-qty">×${i.qty}</span>
    </div>`).join('');

  screen.classList.add('show');
}

function resetForm() {
  selectedDriver = null;
  quantities = {};
  selectedReason = null;
  document.getElementById('driverSearch').value = '';
  document.getElementById('successScreen').classList.remove('show');
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').value = today;
  renderDrivers(DRIVERS);
  renderItems();
  renderReasons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
